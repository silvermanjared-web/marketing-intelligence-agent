name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketing intelligence agent (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Run repository guardrails
        run: python scripts/validate_repo.py

      - name: Compile Python modules
        run: python -m py_compile $(git ls-files "*.py")

      - name: Check command help
        run: python hub.py --help >/dev/null

  required:
    name: Validate marketing intelligence agent
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Require validation matrix success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
