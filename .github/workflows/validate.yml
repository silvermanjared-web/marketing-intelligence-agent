name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketing intelligence agent (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Run repository guardrails
        run: python scripts/validate_repo.py

      - name: Compile Python modules
        run: python -m py_compile $(git ls-files "*.py")

      - name: Run smoke, unit, and security tests
        run: npm test

      - name: Check command help
        run: python hub.py --help >/dev/null

  required:
    name: Validate marketing intelligence agent
    if: ${{ always() }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Require validation matrix success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
